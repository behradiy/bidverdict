<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BidVerdict demo</title>
<style>
  /* 1280x720 stage for the landing-page demo video. Captions left, the real side panel right. */
  :root { --navy: #13294B; --paper: #F5F6F8; --line: #DCE1E8; --go: #22C55E; --stop: #F87171; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--paper); }
  .stage { position: relative; width: 1280px; height: 720px; display: grid; grid-template-columns: 560px 1fr; }
  .copy { background: var(--navy); color: #fff; padding: 64px 56px; display: flex; flex-direction: column; gap: 18px; position: relative; }
  .brand { display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 21px; }
  .brand img { width: 36px; height: 36px; }
  .step { font: 600 14px/1 ui-monospace, Menlo, monospace; letter-spacing: .1em; text-transform: uppercase; color: #8FB3FF; margin-top: 46px; }
  h1 { font-size: 46px; line-height: 1.08; margin: 0; letter-spacing: -.025em; max-width: 12.5ch; }
  p { font-size: 20px; line-height: 1.5; margin: 0; color: #C9D4E6; max-width: 30ch; }
  .fade { transition: opacity .35s ease, transform .35s ease; }
  .fade.out { opacity: 0; transform: translateY(8px); }
  .dots { position: absolute; left: 56px; bottom: 48px; display: flex; gap: 8px; }
  .dots i { width: 28px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.22); transition: background .3s; }
  .dots i.on { background: var(--go); }
  .right { position: relative; display: grid; place-items: center; background: linear-gradient(#EEF1F5, #E2E7EE); }
  .panel { position: relative; width: 400px; height: 664px; background: #fff; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; box-shadow: 0 24px 60px rgba(15,27,45,.22); }
  .panel iframe { position: absolute; inset: 0; width: 400px; height: 664px; border: 0; transition: opacity .45s ease; }
  #f2 { opacity: 0; }
  .cursor { position: absolute; left: 0; top: 0; width: 26px; height: 26px; z-index: 10; pointer-events: none; transition: transform .7s cubic-bezier(.3,.7,.2,1), opacity .3s; opacity: 0; filter: drop-shadow(0 2px 3px rgba(0,0,0,.35)); }
  .ring { position: absolute; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; border: 3px solid var(--navy); opacity: 0; z-index: 9; pointer-events: none; }
  .ring.go { animation: ring .5s ease-out; }
  @keyframes ring { from { opacity: .7; transform: scale(.4); } to { opacity: 0; transform: scale(1.3); } }
  .end { position: absolute; inset: 0; z-index: 20; background: var(--navy); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; opacity: 0; transition: opacity .5s ease; text-align: center; }
  .end.show { opacity: 1; }
  .end img { width: 120px; height: 120px; }
  .end .name { font-size: 64px; font-weight: 800; letter-spacing: -.03em; }
  .end .tag { font-size: 24px; color: #C9D4E6; }
  .end .chips { display: flex; gap: 10px; margin-top: 6px; }
  .end .chip { font-size: 18px; font-weight: 700; padding: 6px 16px; border-radius: 999px; }
  .chip.go { background: #22C55E; color: #06210F; } .chip.warn { background: #FBBF24; color: #2B1B00; } .chip.stop { background: #F87171; color: #2B0606; }
  .end .cta { margin-top: 10px; font-size: 18px; color: #8FB3FF; }
</style>
</head>
<body>
<div class="stage">
  <section class="copy">
    <div class="brand"><img src="/extension/icons/icon128.png" alt="">BidVerdict</div>
    <div class="fade" id="text">
      <div class="step" id="step"></div>
      <h1 id="h"></h1>
      <p id="p" style="margin-top:18px"></p>
    </div>
    <div class="dots" id="dots"><i></i><i></i><i></i><i></i><i></i></div>
  </section>
  <section class="right">
    <div class="panel" id="panel">
      <iframe id="f1" title="Side panel" src="/test/harness/index.html?notice=sample&profile=filled&api=mock&reset=1&delay=2600"></iframe>
      <iframe id="f2" title="Side panel, second notice" src="/test/harness/index.html?notice=sdvosb&profile=filled&api=mock&auto=1"></iframe>
    </div>
  </section>
  <svg class="cursor" id="cursor" viewBox="0 0 24 24"><path d="M4 2l15 11-6.5 1.2L16 21l-2.8 1.3-3.2-6.6L5 19z" fill="#fff" stroke="#0F1B2D" stroke-width="1.6" stroke-linejoin="round"/></svg>
  <div class="ring" id="ring"></div>
  <div class="end" id="end">
    <img src="/extension/icons/icon128.png" alt="">
    <div class="name">BidVerdict</div>
    <div class="tag">Bid or no-bid on SAM.gov opportunities, in about a minute.</div>
    <div class="chips"><span class="chip go">Bid</span><span class="chip warn">Consider</span><span class="chip stop">No-bid</span></div>
    <div class="cta">Free Chrome extension</div>
  </div>
</div>
<script src="demo.js"></script>
</body>
</html>
